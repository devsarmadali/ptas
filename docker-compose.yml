services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ptas
      POSTGRES_PASSWORD: ptas
      POSTGRES_DB: ptas
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptas"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ptas_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  ptas_postgres:
