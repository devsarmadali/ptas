openapi: 3.1.0
info:
  title: PTAS API
  version: 0.1.0
  description: Foundation contract. Approval-gated fields and endpoints must not be activated from this draft alone.
servers:
  - url: /api/v1
security:
  - sessionAuth: []
paths:
  /health:
    get:
      security: []
      operationId: getHealth
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /jurisdictions:
    get:
      operationId: listJurisdictions
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [REGION, DISTRICT, OFFICE, CIRCLE] }
        - name: parentId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: List of jurisdictions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JurisdictionList"
        default: { $ref: "#/components/responses/Problem" }
  /jurisdictions/{jurisdictionId}:
    get:
      operationId: getJurisdiction
      parameters:
        - $ref: "#/components/parameters/JurisdictionId"
      responses:
        "200":
          description: Jurisdiction details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jurisdiction"
        default: { $ref: "#/components/responses/Problem" }
  /taxpayers:
    get:
      operationId: searchTaxpayers
      parameters:
        - name: q
          in: query
          schema: { type: string, minLength: 2 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Jurisdiction-filtered taxpayer search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxpayerPage"
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTaxpayer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaxpayer" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Taxpayer" }
        default: { $ref: "#/components/responses/Problem" }
  /taxpayers/duplicates:
    post:
      operationId: checkDuplicateCandidates
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckDuplicates" }
      responses:
        "200":
          description: List of surfaced duplicate candidates
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DuplicateCandidate" }
        default: { $ref: "#/components/responses/Problem" }
  /configurations:
    get:
      operationId: listConfigurations
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [SCHEDULE, CATEGORY, RATE, FORM, ACCOUNT_HEAD] }
        - name: code
          in: query
          schema: { type: string }
        - name: asOf
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Legal configuration versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LegalConfiguration" }
        default: { $ref: "#/components/responses/Problem" }
  /assessments/{assessmentId}/submit:
    post:
      operationId: submitAssessment
      parameters:
        - $ref: "#/components/parameters/AssessmentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assessment" }
        default: { $ref: "#/components/responses/Problem" }
  /assessments/{assessmentId}/approve:
    post:
      operationId: approveAssessment
      parameters:
        - $ref: "#/components/parameters/AssessmentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisionReason, approvalEvidenceId]
              properties:
                decisionReason: { type: string, minLength: 5 }
                approvalEvidenceId: { type: string, format: uuid }
      responses:
        "200":
          description: Approved and demand entry created transactionally
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assessment" }
        default: { $ref: "#/components/responses/Problem" }
  /assessments/{assessmentId}/revisions:
    post:
      operationId: createAssessmentRevision
      parameters:
        - $ref: "#/components/parameters/AssessmentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revisionReason, snapshot]
              properties:
                revisionReason: { type: string, minLength: 5 }
                snapshot: { type: object }
      responses:
        "201":
          description: Revision version created in REVISION_DRAFT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assessment" }
        default: { $ref: "#/components/responses/Problem" }
    get:
      operationId: listAssessmentVersions
      parameters:
        - $ref: "#/components/parameters/AssessmentId"
      responses:
        "200":
          description: List of immutable versions for this assessment
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AssessmentVersion" }
        default: { $ref: "#/components/responses/Problem" }
  /demand-units/{demandUnitId}/entries:
    get:
      operationId: listDemandLedgerEntries
      parameters:
        - $ref: "#/components/parameters/DemandUnitId"
        - name: financialYearId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Immutable demand ledger entries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DemandLedgerEntry" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: postDemandLedgerEntry
      parameters:
        - $ref: "#/components/parameters/DemandUnitId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostDemandLedgerEntry" }
      responses:
        "201":
          description: Posted append-only demand ledger entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemandLedgerEntry" }
        default: { $ref: "#/components/responses/Problem" }
  /demand-units/{demandUnitId}/balance:
    get:
      operationId: getDemandLedgerBalance
      parameters:
        - $ref: "#/components/parameters/DemandUnitId"
        - name: financialYearId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Derived demand ledger balance
          content:
            application/json:
              schema:
                type: object
                required: [demandUnitId, balance]
                properties:
                  demandUnitId: { type: string, format: uuid }
                  financialYearId: { type: [string, "null"], format: uuid }
                  balance: { type: number }
        default: { $ref: "#/components/responses/Problem" }
  /documents/{documentId}:
    get:
      operationId: getDocumentRecord
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document record with verification hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRecord"
        default: { $ref: "#/components/responses/Problem" }
  /documents/{documentId}/verify:
    post:
      operationId: verifyDocument
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        "200":
          description: Verification outcome against stored SHA-256 hash
          content:
            application/json:
              schema:
                type: object
                required: [documentId, sha256, verified, isProvisional]
                properties:
                  documentId: { type: string, format: uuid }
                  sha256: { type: string }
                  verified: { type: boolean }
                  isProvisional: { type: boolean }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: ptas_session
  parameters:
    JurisdictionId:
      name: jurisdictionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DemandUnitId:
      name: demandUnitId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    Problem:
      description: Problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded] }
    Jurisdiction:
      type: object
      required: [id, type, code, name, activeFrom]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [REGION, DISTRICT, OFFICE, CIRCLE] }
        code: { type: string }
        name: { type: string }
        parentId: { type: [string, "null"], format: uuid }
        activeFrom: { type: string, format: date }
        activeTo: { type: [string, "null"], format: date }
    JurisdictionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Jurisdiction" }
    CreateTaxpayer:
      type: object
      required: [displayName, jurisdictionId]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 250 }
        jurisdictionId: { type: string, format: uuid }
        identifiers:
          type: array
          items:
            type: object
            required: [type, value]
            properties:
              type: { type: string }
              value: { type: string }
    TaxpayerIdentifier:
      type: object
      required: [identifierType, maskedValue, validFrom]
      properties:
        identifierType:
          {
            type: string,
            enum: [CNIC, NTN, PASSPORT, PRA_PNTN, LEGACY_ASSESSEE_CODE, REGISTRATION_NO]
          }
        maskedValue: { type: string }
        validFrom: { type: string, format: date }
        validTo: { type: [string, "null"], format: date }
    Taxpayer:
      type: object
      required: [id, displayName, status, currentCircleId]
      properties:
        id: { type: string, format: uuid }
        permanentDemandNo: { type: [string, "null"] }
        displayName: { type: string }
        status: { type: string, enum: [DRAFT, ACTIVE, CLOSED, DUPLICATE_MERGED, ARCHIVED] }
        currentCircleId: { type: string, format: uuid }
        identifiers:
          type: array
          items: { $ref: "#/components/schemas/TaxpayerIdentifier" }
    CheckDuplicates:
      type: object
      required: [displayName, currentCircleId]
      properties:
        displayName: { type: string }
        currentCircleId: { type: string, format: uuid }
        identifiers:
          type: array
          items:
            type: object
            required: [identifierType, value]
            properties:
              identifierType: { type: string }
              value: { type: string }
    DuplicateCandidate:
      type: object
      required: [existingTaxpayerId, existingDisplayName, matchReason, confidence, matchedFields]
      properties:
        existingTaxpayerId: { type: string, format: uuid }
        existingDisplayName: { type: string }
        matchReason: { type: string }
        confidence: { type: string, enum: [EXACT, HIGH, MEDIUM] }
        matchedFields:
          type: array
          items: { type: string }
    TaxpayerPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Taxpayer" }
        nextCursor: { type: [string, "null"] }
    Assessment:
      type: object
      required: [id, taxpayerId, financialYearId, status, currentVersionNo]
      properties:
        id: { type: string, format: uuid }
        taxpayerId: { type: string, format: uuid }
        financialYearId: { type: string, format: uuid }
        status:
          {
            type: string,
            enum:
              [
                DRAFT,
                SUBMITTED,
                RETURNED,
                HEARING_RECORDED,
                APPROVED,
                REVISION_DRAFT,
                RESUBMITTED,
                DECISION_REQUESTED,
                WITHDRAWN,
                ADJUSTED
              ]
          }
        currentVersionNo: { type: integer, minimum: 1 }
    AssessmentVersion:
      type: object
      required: [id, assessmentId, versionNo, status, snapshot, createdAt]
      properties:
        id: { type: string, format: uuid }
        assessmentId: { type: string, format: uuid }
        versionNo: { type: integer, minimum: 1 }
        status:
          {
            type: string,
            enum:
              [
                DRAFT,
                SUBMITTED,
                RETURNED,
                HEARING_RECORDED,
                APPROVED,
                REVISION_DRAFT,
                RESUBMITTED,
                DECISION_REQUESTED,
                WITHDRAWN,
                ADJUSTED
              ]
          }
        snapshot: { type: object }
        reason: { type: [string, "null"] }
        approvedBy: { type: [string, "null"], format: uuid }
        approvedAt: { type: [string, "null"], format: date-time }
        approvalEvidenceId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, correlationId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlationId: { type: string }
    ApprovalEvidence:
      type: object
      required:
        [
          id,
          approvalIdentifier,
          approvingAuthority,
          approvedOn,
          sourceDocumentSha256,
          effectiveFrom
        ]
      properties:
        id: { type: string, format: uuid }
        approvalIdentifier: { type: string }
        approvingAuthority: { type: string }
        approvedOn: { type: string, format: date }
        sourceDocumentSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, "null"], format: date }
    LegalConfiguration:
      type: object
      required: [id, configType, code, versionNo, effectiveFrom, payload, status]
      properties:
        id: { type: string, format: uuid }
        configType: { type: string, enum: [SCHEDULE, CATEGORY, RATE, FORM, ACCOUNT_HEAD] }
        code: { type: string }
        versionNo: { type: integer, minimum: 1 }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, "null"], format: date }
        payload: { type: object }
        status: { type: string, enum: [DRAFT, APPROVED, ACTIVE, RETIRED] }
        approvalEvidenceId: { type: [string, "null"], format: uuid }
    DemandUnit:
      type: object
      required: [id, taxpayerId, permanentDemandNo, createdAt]
      properties:
        id: { type: string, format: uuid }
        taxpayerId: { type: string, format: uuid }
        permanentDemandNo: { type: string }
        createdAt: { type: string, format: date-time }
    DemandLedgerEntry:
      type: object
      required:
        [
          id,
          demandUnitId,
          financialYearId,
          entryType,
          amount,
          sourceType,
          sourceId,
          idempotencyKey,
          correlationId,
          postedBy,
          postedAt,
          metadata
        ]
      properties:
        id: { type: string, format: uuid }
        demandUnitId: { type: string, format: uuid }
        financialYearId: { type: string, format: uuid }
        entryType:
          {
            type: string,
            enum:
              [ASSESSMENT_DEMAND, REVISION_ADJUSTMENT, PENALTY_DEMAND, MANUAL_ADJUSTMENT, REVERSAL]
          }
        amount: { type: number }
        sourceType: { type: string }
        sourceId: { type: string, format: uuid }
        reversesEntryId: { type: [string, "null"], format: uuid }
        idempotencyKey: { type: string }
        correlationId: { type: string }
        postedBy: { type: string, format: uuid }
        postedAt: { type: string, format: date-time }
        metadata: { type: object }
    PostDemandLedgerEntry:
      type: object
      required: [financialYearId, entryType, amount, sourceType, sourceId]
      properties:
        financialYearId: { type: string, format: uuid }
        entryType:
          {
            type: string,
            enum:
              [ASSESSMENT_DEMAND, REVISION_ADJUSTMENT, PENALTY_DEMAND, MANUAL_ADJUSTMENT, REVERSAL]
          }
        amount: { type: number, not: { enum: [0] } }
        sourceType: { type: string }
        sourceId: { type: string, format: uuid }
        reversesEntryId: { type: string, format: uuid }
        metadata: { type: object }
    DocumentRecord:
      type: object
      required:
        [
          id,
          aggregateType,
          aggregateId,
          templateConfigId,
          objectKey,
          sha256,
          generatedAt,
          generatedBy,
          snapshot,
          isProvisional
        ]
      properties:
        id: { type: string, format: uuid }
        aggregateType: { type: string }
        aggregateId: { type: string, format: uuid }
        templateConfigId: { type: string, format: uuid }
        objectKey: { type: string }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        generatedAt: { type: string, format: date-time }
        generatedBy: { type: string, format: uuid }
        snapshot: { type: object }
        isProvisional: { type: boolean }
